name: Deploy Jobryn to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'nexgen-studio/nexus-app/**'
      - '.github/workflows/deploy-jobryn-cloudflare.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nexgen-studio/nexus-app/**'
      - '.github/workflows/deploy-jobryn-cloudflare.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nexgen-studio/nexus-app
    env:
      SKIP_ENV_VALIDATION: '1'
      NEXT_PUBLIC_APP_URL: https://jobryn.org
      NEXT_PUBLIC_SITE_URL: https://jobryn.org
      NEXTAUTH_URL: https://jobryn.org
      NEXT_PUBLIC_SUPABASE_URL: https://pmqtkcenovlwshurglkp.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_H7ggm7ASPc-HgDQdMIBWeQ__9GCzVus
      SUPABASE_URL: https://pmqtkcenovlwshurglkp.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build for Cloudflare
        run: pnpm cf:build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nexgen-studio/nexus-app
    env:
      SKIP_ENV_VALIDATION: '1'
      NEXT_PUBLIC_APP_URL: https://jobryn.org
      NEXT_PUBLIC_SITE_URL: https://jobryn.org
      NEXTAUTH_URL: https://jobryn.org
      NEXT_PUBLIC_SUPABASE_URL: https://pmqtkcenovlwshurglkp.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_H7ggm7ASPc-HgDQdMIBWeQ__9GCzVus
      SUPABASE_URL: https://pmqtkcenovlwshurglkp.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Jobryn
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
