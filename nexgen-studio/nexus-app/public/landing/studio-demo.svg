<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="118" y1="98" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111E"/>
      <stop offset="0.6" stop-color="#112748"/>
      <stop offset="1" stop-color="#0D1728"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8EFBDA"/>
      <stop offset="1" stop-color="#46A3FF"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#77C4FF"/>
      <stop offset="1" stop-color="#5D69FF"/>
    </linearGradient>
    <style>
      .floatA { animation: floatA 6s ease-in-out infinite; transform-origin: center; }
      .floatB { animation: floatB 7s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .sweep { animation: sweep 5s linear infinite; }
      .rise1 { animation: rise 3s ease-in-out infinite; }
      .rise2 { animation: rise 3s ease-in-out infinite 0.4s; }
      .rise3 { animation: rise 3s ease-in-out infinite 0.8s; }
      .progress { animation: progress 4s ease-in-out infinite; transform-origin: left center; }
      @keyframes floatA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-16px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(18px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes sweep {
        0% { transform: translateX(-260px); opacity: 0; }
        20% { opacity: 0.25; }
        80% { opacity: 0.25; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
      @keyframes rise {
        0%, 100% { transform: scaleY(0.6); opacity: 0.65; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes progress {
        0%, 100% { transform: scaleX(0.35); }
        50% { transform: scaleX(0.92); }
      }
    </style>
  </defs>

  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <rect x="96" y="92" width="1408" height="716" rx="36" fill="#09101A" stroke="#7CC5FF" stroke-opacity="0.16"/>
  <rect x="140" y="138" width="536" height="624" rx="28" fill="#111E31"/>
  <rect x="712" y="138" width="748" height="286" rx="28" fill="#10192A"/>
  <rect x="712" y="456" width="748" height="306" rx="28" fill="#10192A"/>

  <text x="184" y="216" fill="#ECF5FF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Studio demo loop</text>
  <text x="184" y="264" fill="#8CCBFF" font-family="Inter, Arial, sans-serif" font-size="20">Prompt. identity. publish. repeat.</text>

  <g class="floatA">
    <rect x="184" y="314" width="208" height="326" rx="24" fill="#0E1725"/>
    <circle cx="288" cy="424" r="82" fill="url(#accentB)"/>
    <rect x="230" y="548" width="116" height="16" rx="8" fill="#F1F7FF" opacity="0.88"/>
    <rect x="244" y="578" width="88" height="12" rx="6" fill="#7EC6FF" opacity="0.5"/>
  </g>

  <g class="floatB">
    <rect x="420" y="314" width="208" height="326" rx="24" fill="#0E1725"/>
    <circle cx="524" cy="424" r="82" fill="url(#accentA)"/>
    <rect x="466" y="548" width="116" height="16" rx="8" fill="#F1F7FF" opacity="0.88"/>
    <rect x="480" y="578" width="88" height="12" rx="6" fill="#92F3D6" opacity="0.5"/>
  </g>

  <rect x="768" y="190" width="636" height="76" rx="24" fill="#0F1D31"/>
  <text x="810" y="238" fill="#ECF5FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Autopilot timeline</text>

  <rect x="768" y="296" width="636" height="78" rx="24" fill="#0F1D31"/>
  <rect class="progress" x="804" y="326" width="520" height="18" rx="9" fill="url(#accentA)"/>
  <g class="pulse">
    <circle cx="1118" cy="335" r="18" fill="#F8FEFF"/>
  </g>

  <rect x="768" y="506" width="294" height="208" rx="24" fill="#0F1D31"/>
  <text x="804" y="562" fill="#ECF5FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Engagement</text>
  <rect x="818" y="618" width="34" height="64" rx="12" fill="#2F7DFF" class="rise1"/>
  <rect x="876" y="592" width="34" height="90" rx="12" fill="#57B5FF" class="rise2"/>
  <rect x="934" y="552" width="34" height="130" rx="12" fill="#92F3D6" class="rise3"/>

  <rect x="1092" y="506" width="312" height="208" rx="24" fill="#0F1D31"/>
  <text x="1128" y="562" fill="#ECF5FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Live scheduler</text>
  <rect x="1134" y="608" width="228" height="16" rx="8" fill="#243348"/>
  <rect x="1134" y="640" width="184" height="16" rx="8" fill="#243348"/>
  <rect x="1134" y="608" width="162" height="16" rx="8" fill="url(#accentB)" class="pulse"/>

  <rect class="sweep" x="0" y="112" width="220" height="676" fill="url(#accentA)" opacity="0.18"/>
</svg>
